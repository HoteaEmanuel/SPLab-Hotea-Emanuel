spring.application.name=SP_LAB
logging.file.name=logs/sp_lab.log

spring.datasource.url=jdbc:h2:file:~/h2db/booksdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database=H2
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Load lazy collections (authors, elements, section children) for up to 20 owners in one query instead of one query each (avoids N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.h2.console.enabled=true
